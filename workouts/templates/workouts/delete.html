{% extends "base.html" %}

{% block title %}Eliminar Entrenamiento{% endblock %}

{% block content %}
<div class="page-head">
    <span class="eyebrow">Zona de riesgo</span>
    <h1>Eliminar Entrenamiento</h1>
</div>

<div class="toolbar">
    <a href="{% url 'workouts:detail' workout.id %}" class="btn">Volver</a>
</div>

<div class="card warning">
    <p class="warn-msg">Esta acción no se puede deshacer.</p>
    <p>¿Estás seguro de que quieres eliminar el entrenamiento del <strong>{{ workout.fecha }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Eliminar</button>
        </div>
    </form>
</div>
{% endblock %}
