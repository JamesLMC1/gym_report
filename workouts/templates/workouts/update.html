{% extends "base.html" %}

{% block title %}Editar Entrenamiento{% endblock %}

{% block content %}
<h1>Editar Entrenamiento del {{ workout.fecha }}</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Actualizar</button>
        <a class="btn" href="{% url 'workouts:detail' workout.id %}" style="background:#555;">Cancelar</a>
    </form>
</div>
{% endblock %}
