{% extends "base.html" %}

{% block title %}Nuevo Entrenamiento{% endblock %}

{% block content %}
<h1>Agregar Entrenamiento</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Guardar</button>
        <a class="btn" href="{% url 'workouts:index' %}" style="background:#555;">Cancelar</a>
    </form>
</div>
{% endblock %}
