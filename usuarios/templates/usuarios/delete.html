{% extends "base_authenticated.html" %}

{% block title %}Eliminar {{ usuario.nombre }}{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Eliminar Usuario</h1>
</div>

<div class="toolbar">
    <a href="{% url 'usuarios:detail' usuario.id %}" class="btn">Volver</a>
</div>

<div class="card warning">
    <p class="warn-msg">Esta acción no se puede deshacer.</p>
    <p>¿Estás seguro de que quieres eliminar a <strong>{{ usuario.nombre }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Eliminar</button>
        </div>
    </form>
</div>
{% endblock %}
