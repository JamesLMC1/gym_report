{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h1>{{ titulo }}</h1>
<a href="{% url 'usuarios:index' %}" class="btn">Volver</a>
<br><br>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p style="color: #e74c3c;">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <div class="actions">
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
