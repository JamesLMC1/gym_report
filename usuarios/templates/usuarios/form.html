{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-head">
    <span class="eyebrow">Paso 01 / Perfiles</span>
    <h1>{{ titulo }}</h1>
</div>

<div class="toolbar">
    <a href="{% url 'usuarios:index' %}" class="btn">Volver</a>
</div>

<div class="card form-wrap">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <ul class="errorlist"><li>{{ field.errors.0 }}</li></ul>
            {% endif %}
        </div>
        {% endfor %}
        <div class="actions">
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
