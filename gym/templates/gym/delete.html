{% extends "base.html" %}

{% block title %}Eliminar {{ set_obj.nombre_ejercicio }}{% endblock %}

{% block content %}
<div class="page-head">
    <span class="eyebrow">Zona de riesgo</span>
    <h1>Eliminar Set</h1>
</div>

<div class="toolbar">
    <a href="{% url 'gym:detail' set_obj.id %}" class="btn">Volver</a>
</div>

<div class="card warning">
    <p class="warn-msg">Esta acción no se puede deshacer.</p>
    <p>¿Estás seguro de que quieres eliminar <strong>{{ set_obj.nombre_ejercicio }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Eliminar</button>
        </div>
    </form>
</div>
{% endblock %}
