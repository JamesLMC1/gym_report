{% extends "base.html" %}

{% block title %}Editar Ejercicio{% endblock %}

{% block content %}
<h1>Editar {{ set.nombre_ejercicio }}</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Actualizar</button>
        <a class="btn" href="{% url 'gym:detail' set.id %}" style="background:#555;">Cancelar</a>
    </form>
</div>
{% endblock %}
