{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Gym Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    <footer class="footer">
        Gym Tracker
    </footer>

    <div id="micro-banner" class="micro-banner" hidden aria-live="polite">
        Conectando al microservicio&hellip;
    </div>

    <div id="confirm-modal" class="confirm-overlay" hidden>
        <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h3 id="confirm-title" class="confirm-title">Confirmar</h3>
            <p id="confirm-msg" class="confirm-msg"></p>
            <div class="confirm-actions">
                <button type="button" class="btn" data-confirm-cancel>Cancelar</button>
                <button type="button" class="btn btn-danger" data-confirm-ok>Aceptar</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var banner = document.getElementById('micro-banner');
        if (!banner) return;

        function show() { banner.hidden = false; }
        function hide() { banner.hidden = true; }
        window.showMicroBanner = show;

        function isCatalog(url) { return /\/catalogo\//.test(url || ''); }
        function isMicroPost(url) { return /\/crear\/|\/editar\/|\/eliminar\//.test(url || ''); }

        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('a[href]') : null;
            if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
            if (isCatalog(a.getAttribute('href'))) show();
        });

        document.addEventListener('submit', function (e) {
            var form = e.target;
            if ((form.method || 'get').toLowerCase() !== 'post') return;
            if (form.hasAttribute('data-confirm')) return;
            var action = form.getAttribute('action') || window.location.pathname;
            if (isMicroPost(action)) show();
        });

        window.addEventListener('pageshow', hide);
    })();

    (function () {
        var modal = document.getElementById('confirm-modal');
        if (!modal) return;
        var msgEl = document.getElementById('confirm-msg');
        var pending = null;

        function close() { modal.hidden = true; pending = null; }

        document.addEventListener('submit', function (e) {
            var form = e.target;
            if (!form.hasAttribute('data-confirm') || form.dataset.confirmed === '1') return;
            e.preventDefault();
            pending = form;
            msgEl.textContent = form.getAttribute('data-confirm');
            modal.hidden = false;
        });

        modal.addEventListener('click', function (e) {
            if (e.target === modal || e.target.hasAttribute('data-confirm-cancel')) { close(); return; }
            if (e.target.hasAttribute('data-confirm-ok')) {
                var form = pending;
                close();
                if (form) {
                    form.dataset.confirmed = '1';
                    if (window.showMicroBanner) window.showMicroBanner();
                    form.submit();
                }
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !modal.hidden) close();
        });
    })();
    </script>
</body>
</html>
