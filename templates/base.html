{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Gym Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    <footer class="footer">
        Entrena <b>//</b> Registra <b>//</b> Evoluciona
    </footer>

    <div id="micro-bar" class="micro-bar" hidden aria-hidden="true">
        <div class="micro-bar-fill"></div>
    </div>
    <span id="micro-bar-text" class="micro-bar-text" hidden aria-live="polite">Conectando&hellip;</span>

    <script>
    (function () {
        var bar = document.getElementById('micro-bar');
        var label = document.getElementById('micro-bar-text');
        if (!bar) return;

        function isMicroAction(url) {
            return /\/catalogo\/|\/crear\/|\/editar\/|\/eliminar\//.test(url || '');
        }

        function show() {
            bar.hidden = false;
            if (label) label.hidden = false;
        }

        function hide() {
            bar.hidden = true;
            if (label) label.hidden = true;
        }

        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('a[href]') : null;
            if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
            if (isMicroAction(a.getAttribute('href'))) show();
        });

        document.addEventListener('submit', function (e) {
            var form = e.target;
            if ((form.method || 'get').toLowerCase() !== 'post') return;
            var action = form.getAttribute('action') || window.location.pathname;
            if (isMicroAction(action)) show();
        });

        window.addEventListener('pageshow', hide);
    })();
    </script>
</body>
</html>
