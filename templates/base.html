{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Gym Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    <footer class="footer">
        Entrena <b>//</b> Registra <b>//</b> Evoluciona
    </footer>

    <div id="micro-overlay" class="micro-overlay" hidden aria-live="polite" aria-busy="true">
        <div class="micro-box">
            <div class="micro-spinner" aria-hidden="true"></div>
            <p class="micro-title">Conectando al microservicio&hellip;</p>
            <p class="micro-target" id="micro-target">Node (Express)</p>
        </div>
    </div>

    {{ microservicios|json_script:"micro-data" }}
    <script>
    (function () {
        var dataEl = document.getElementById('micro-data');
        var overlay = document.getElementById('micro-overlay');
        var target = document.getElementById('micro-target');
        if (!overlay) return;

        var names = ['Node (Express)'];
        if (dataEl) {
            try {
                var list = JSON.parse(dataEl.textContent) || [];
                if (list.length) names = list.map(function (m) { return m.label; });
            } catch (e) {}
        }

        var timer = null;
        var index = 0;

        function isMicroAction(url) {
            return /\/catalogo\/|\/create\/|\/edit\/|\/delete\//.test(url || '');
        }

        function show() {
            overlay.hidden = false;
            index = 0;
            if (target) target.textContent = names[0];
            if (timer) clearInterval(timer);
            timer = setInterval(function () {
                index = (index + 1) % names.length;
                if (target) target.textContent = names[index];
            }, 1300);
        }

        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('a[href]') : null;
            if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
            if (isMicroAction(a.getAttribute('href'))) show();
        });

        document.addEventListener('submit', function (e) {
            var form = e.target;
            if ((form.method || 'get').toLowerCase() !== 'post') return;
            var action = form.getAttribute('action') || window.location.pathname;
            if (isMicroAction(action)) show();
        });

        window.addEventListener('pageshow', function () {
            if (timer) { clearInterval(timer); timer = null; }
            overlay.hidden = true;
        });
    })();
    </script>
</body>
</html>
