{% extends "base.html" %}

{% block body %}
<nav>
    <a href="{% url 'home' %}" class="brand">Gym Tracker</a>
    <div class="nav-links">
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Inicio</a>
        <a href="{% url 'gym:index' %}" class="{% if request.resolver_match.app_name == 'gym' %}active{% endif %}">Ejercicios</a>
        <a href="{% url 'workouts:index' %}" class="{% if request.resolver_match.app_name == 'workouts' %}active{% endif %}">Entrenamientos</a>
        <a href="{% url 'dietas:index' %}" class="{% if request.resolver_match.app_name == 'dietas' %}active{% endif %}">Dietas</a>
        <a href="{% url 'chat:index' %}" class="{% if request.resolver_match.app_name == 'chat' %}active{% endif %}">Chat</a>
        <a href="{% url 'profesores_involucrados:index' %}" class="{% if request.resolver_match.app_name == 'profesores_involucrados' %}active{% endif %}">Docentes</a>
    </div>
    <div class="nav-user">
        {% if request.user.is_staff %}<a href="{% url 'admin:index' %}" class="nav-admin">Admin</a>{% endif %}
        <span class="nav-user-name">{{ request.user.username }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-logout">Salir</button>
        </form>
    </div>
</nav>
<div class="container">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
</div>
{% endblock %}
